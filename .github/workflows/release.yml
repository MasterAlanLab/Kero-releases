name: Release Kero
run-name: Kero ${{ inputs.version || github.ref_name }} · ${{ github.event_name == 'push' && 'tag' || 'manual' }} · ${{ inputs.source_ref || 'main' }}

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 1.0.0（不带 v）'
        required: true
        type: string
      source_ref:
        description: 'MasterAlanLab/Kero 的标签、分支或提交 SHA'
        required: true
        default: main
        type: string
      release_notes:
        description: '更新说明（可留空，自动从源码提交生成）'
        required: false
        type: string
      draft:
        description: '仅保存草稿（默认构建成功后直接公开）'
        default: false
        type: boolean
      prerelease:
        description: '标记为预发布（官网不作为正式版展示）'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: kero-release
  cancel-in-progress: false

env:
  KERO_VERSION: ${{ inputs.version || github.ref_name }}
  KERO_SOURCE_REF: ${{ inputs.source_ref || 'main' }}
  KERO_NOTES: ${{ inputs.release_notes }}
  # Bake the Kero identity into the installed app, not just the CI process.
  KERO_PLATFORM_POOL: '1'
  # Agent binaries are prepared by the existing packaging entry when needed.
  XDT_SKIP_AGENT_BIN_INSTALL: '1'
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.preflight.outputs.version }}
      should_build: ${{ steps.preflight.outputs.should_build }}
    steps:
      - name: Checkout release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate parameters and release state
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          KERO_SOURCE_TOKEN: ${{ secrets.KERO_SOURCE_TOKEN }}
        run: |
          node scripts/release.mjs preflight
          node --test scripts/release.test.mjs

      - name: Resolve source to one commit
        if: steps.preflight.outputs.should_build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MasterAlanLab/Kero
          ref: ${{ env.KERO_SOURCE_REF }}
          token: ${{ secrets.KERO_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Record source commit
        if: steps.preflight.outputs.should_build == 'true'
        id: source
        run: |
          echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate changelog and daily title
        if: steps.preflight.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KERO_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/release.mjs details source release-details.json

      - name: Save release text for publication
        if: steps.preflight.outputs.should_build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-details
          path: release-details.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2025
            package_args: ''
          - platform: macos
            os: macos-15-intel
            package_args: ''
          - platform: linux
            os: ubuntu-22.04
            package_args: '--skip-smoke'
    defaults:
      run:
        shell: bash
    env:
      KERO_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      KERO_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact source with LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MasterAlanLab/Kero
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.KERO_SOURCE_TOKEN }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
          path: source

      - name: Setup pnpm from source pin
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: source/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          fakeroot dpkg desktop-file-utils build-essential pkg-config
          libwayland-bin libwayland-dev libxkbcommon-dev libjson-c-dev
          libturbojpeg0-dev libpng-dev

      # Windows packaging builds the in-app updater (cindy-updater, Rust + Tauri)
      # from source and fails without cargo; check the runner image early.
      - name: Check Rust toolchain for the Windows updater
        if: runner.os == 'Windows'
        run: cargo --version && rustc --version

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Package desktop
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          pnpm release:package --
          --region global
          --version "$KERO_VERSION"
          --no-sign
          ${{ matrix.package_args }}

      - name: Verify and stage installers
        env:
          KERO_PLATFORM: ${{ matrix.platform }}
        run: node scripts/release.mjs stage source/apps/desktop/release/artifacts/global staged

      - name: Save installers for publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          path: staged/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish complete release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      KERO_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      KERO_DRAFT: ${{ inputs.draft || false }}
      KERO_PRERELEASE: ${{ inputs.prerelease || false }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download all platform installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: staged

      - name: Download generated release text
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-details
          path: metadata

      - name: Verify all platforms and publish
        run: node scripts/release.mjs publish staged dist metadata/release-details.json
